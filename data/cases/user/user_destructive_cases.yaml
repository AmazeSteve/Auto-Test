- id: WB_USER_DESTRUCTIVE_DEMO_001 #查询指定用户组下用户列表（依赖 WB_USER_GROUP_004）
  enabled: true
  order: 900
  endpoint: EP_USER_UPDATE
  depends_on:
    - WB_USER_004
  priority: P1
  owner: Rey
  case_type: api
  name: 危险接口保护示例-修改用户
  tags:
    - destructive
    - update
  lifecycle:
    verify: WB_USER_DESTRUCTIVE_VERIFY_001
    rollback: WB_USER_DESTRUCTIVE_ROLLBACK_001
    verify_rollback: WB_USER_DESTRUCTIVE_VERIFY_ROLLBACK_001
  effect:
    type: update
    require_change: true
    target:
      resource: user
      fields:
        - usr_display_bil
        - userGroupId
        - gradeId
    capture:
      enabled: true
      # logical field -> Capture payload JSONPath
      fields:
        usr_display_bil: $.data.usr_display_bil
        userGroupId: $.data.userGroupId
        gradeId: $.data.gradeId
      before:
        endpoint: EP_USER_GET_FORM
        data:
          pdate: $timestamp_ms
          usr_ent_id: "{{target_usr_ent_id}}"
        expected_status: 200
        expected_code: 200
      after:
        endpoint: EP_USER_GET_FORM
        data:
          pdate: $timestamp_ms
          usr_ent_id: "{{target_usr_ent_id}}"
        expected_status: 200
        expected_code: 200
  risk_level: update
  request_builder:
    name: user_update
    source:
      type: effect_before
      expression: $.data
    arguments:
      cur_lan: "zh-cn"
    mutable_fields:
      - usr_display_bil
    overrides:
      usr_display_bil: "{{$data.unique_display_name}}"
  validate:
    - type: status_code
      expected: 200
    - type: json_path_equals
      expression: $.code
      expected: 200
#增加修改后验证用例
- id: WB_USER_DESTRUCTIVE_VERIFY_001
  enabled: true
  order: 901
  endpoint: EP_USER_GET_FORM
  depends_on:
    - WB_USER_DESTRUCTIVE_DEMO_001
  priority: P1
  owner: Rey
  case_type: api
  name: 危险接口验证-用户全名已修改

  tags:
    - destructive
    - update
    - verify
  risk_level: update

  data:
    pdate: $timestamp_ms
    usr_ent_id: "{{target_usr_ent_id}}"
  validate:
    - type: status_code
      expected: 200
    - type: json_path_equals
      expression: $.code
      expected: 200
    - type: json_path_equals
      expression: $.data.usr_display_bil
      expected: "{{$data.unique_display_name}}"
    - type: json_path_equals
      expression: $.data.userGroupId
      expected: "{{original_user_group_id}}"
    - type: json_path_equals
      expression: $.data.gradeId
      expected: "{{original_grade_id}}"
#增加恢复用例
- id: WB_USER_DESTRUCTIVE_ROLLBACK_001
  enabled: true
  order: 902
  endpoint: EP_USER_UPDATE
  depends_on:
    - WB_USER_DESTRUCTIVE_DEMO_001
  priority: P1
  owner: Rey
  case_type: api
  name: 危险接口回滚-恢复用户全名显示名称

  tags:
    - destructive
    - rollback
  risk_level: reset
  restore_payload:
    source_effect: WB_USER_DESTRUCTIVE_DEMO_001
  validate:
    - type: status_code
      expected: 200
    - type: json_path_equals
      expression: $.code
      expected: 200
#增加恢复后验证
- id: WB_USER_DESTRUCTIVE_VERIFY_ROLLBACK_001
  enabled: true
  order: 903
  endpoint: EP_USER_GET_FORM
  depends_on:
    - WB_USER_DESTRUCTIVE_ROLLBACK_001
  priority: P1
  owner: Rey
  case_type: api
  name: 危险接口验证-用户显示名称已恢复

  tags:
    - destructive
    - rollback
    - verify
  risk_level: update

  data:
    pdate: $timestamp_ms
    usr_ent_id: "{{target_usr_ent_id}}"
  validate:
    - type: status_code
      expected: 200
    - type: json_path_equals
      expression: $.code
      expected: 200
    - type: json_path_equals
      expression: $.data.usr_display_bil
      expected: "{{original_usr_display_bil}}"
    - type: json_path_equals
      expression: $.data.userGroupId
      expected: "{{original_user_group_id}}"
    - type: json_path_equals
      expression: $.data.gradeId
      expected: "{{original_grade_id}}"
