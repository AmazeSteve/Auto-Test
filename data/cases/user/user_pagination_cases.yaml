# ============================================================
# 用户标签分页场景
# Endpoint:
#   EP_USER_TAG_COMMON_LIST
#
# 目标：
#   验证同一个 Endpoint 在不同分页参数下的分页契约
# ============================================================


# ------------------------------------------------------------
# Case 1: 最小分页大小
# ------------------------------------------------------------
- id: WB_USER_PAGE_001
  enabled: true
  order: 710
  endpoint: EP_USER_TAG_COMMON_LIST

  priority: P2
  owner: Rey
  case_type: api
  name: 用户标签分页-pageSize为1

  tags:
    - readonly
    - pagination
    - user-pagination

  params:
    pageNo: 1
    pageSize: 1
    text: ""
    pdate: $timestamp_ms

  validate:
    - type: status_code
      expected: 200

    - type: pagination
      total: $.total
      total_page: $.totalPage
      page: $.page
      page_size: $.pageSize
      rows: $.rows

      expected_page: 1
      expected_page_size: 1
      check_total_page: true
      strict_rows: true


