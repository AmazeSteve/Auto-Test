- id: WB_USER_REF_001
  enabled: true
  order: 700
  endpoint: EP_USER_GRADE_TREE

  priority: P2
  owner: Rey
  case_type: api
  name: 查询用户职级树

  tags:
    - readonly
    - user-reference
  params:
    pdate: $timestamp_ms

  validate:
    - type: status_code
      expected: 200

    - type: json_path_equals
      expression: $.code
      expected: 200

    - type: json_path_equals
      expression: $.message
      expected: success

    - type: json_path_exists
      expression: $.data.ugr_display_bil

    - type: json_path_exists
      expression: $.data.children

    - type: json_path_type
      expression: $.data.children
      expected_type: list

    - type: json_path_not_empty
      expression: $.data.children

