          pdate: $timestamp_ms
          usr_ent_id: '{{target_usr_ent_id}}'
        expected_status: 200
        expected_code: 200
      after:
        endpoint: EP_USER_GET_FORM
        data:
          pdate: $timestamp_ms
          usr_ent_id: '{{target_usr_ent_id}}'
        expected_status: 200
        expected_code: 200
